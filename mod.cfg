-- Mercenaries mod cvar config.
--
-- The game logs "[Error] Validator: Config file 'mods/mercenaries/mod.cfg' not found!"
-- on every launch when this file is absent. It is also the supported place for a mod
-- to set cvars persistently, which survives the CVarOverride re-application that
-- defeated in-session console changes (see docs/npc-lod.md).
--
-- Add cvars here only with a measured reason.
--
-- ===========================================================================
-- CHARACTER SIMULATION BUDGET                              measured 2026-08-28
-- ===========================================================================
-- Found by the mod's own auto-tuner (merc_opt) running a coordinate descent over 18
-- render and simulation cvars, in the siege of Raborsch, on a CPU restricted to two
-- cores - a stand-in for the mid-range machines the "4-5 mercs costs 40-50fps in towns"
-- reports come from.
--
--   baseline 21.6 fps  ->  29.3 fps   (+35.7%), 46 measured trials, 3 passes
--
-- Every one of the three below is a SIMULATION cut, not a detail cut. Nothing that
-- changes how the game LOOKS survived its threshold: view distance, character LOD floor,
-- uberlod swap distance, outfit streaming and attachment culling were all tried, in both
-- directions, across three passes, and every one came back negative or inside noise.
--
-- Undo any of this at runtime with merc_perf_defaults_off (and merc_perf_defaults_on).

-- The adaptive cloth budget may skip far more frames before it gives up. This was the
-- single biggest win: three accepted steps worth +7.0%, +2.8% and +13.7%. The engine
-- already throttles cloth adaptively; the stock ceiling is simply too conservative for a
-- weak CPU with a large squad. Cloth updates less often. Nothing is drawn differently.
wh_ca_ClothBudgetMaxFramesToSkip = 20

-- Simulate pendulums (scabbards, pouches, hair) only at LOD 0 instead of LOD 0-2.
-- "Disable simulation of pendulums if animation lod of the character is higher than this
-- value." Distant characters stop swinging their kit; close ones are untouched.
wh_ca_PendulumMaxLodToSimulate = 1

-- Cloth SIMULATION off - "if this is 1 actual cloth simulation is disabled (wrap skinning
-- still works)". Garments still deform with the body, so characters look right; cloth just
-- stops swinging independently. This is the one item here with a visible cost, and it is
-- global (it applies to vanilla NPCs too). It measured +5.4% and is the difference between
-- a playable and an unplayable siege on a weak CPU. merc_perf_defaults_off restores it.
ca_ClothBypassSimulation = 1
